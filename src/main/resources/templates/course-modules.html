<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${program.title} + ' | Course Modules'">
        Course Modules
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #222;
            line-height: 1.6;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px 0;
        }

        .back {
            text-decoration: none;
            color: #6b46c1;
            font-weight: 600;
        }

        .hero {
            padding: 45px 0 30px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
            max-width: 750px;
        }

        .modules {
            display: grid;
            gap: 18px;
            padding-bottom: 50px;
        }

        .module {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .module-number {
            min-width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #6b46c1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .module-content {
            flex: 1;
        }

        .module-content h3 {
            margin-bottom: 5px;
        }

        .module-content p {
            color: #666;
        }

        .module-status {
            color: #16803c;
            font-size: 14px;
            font-weight: 600;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 650px) {
            .module {
                align-items: flex-start;
            }

            .module-status {
                display: none;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <a class="back"
           th:href="@{/dashboard}">
            ← Back to My Learning
        </a>
    </div>
</header>

<main class="container">

    <section class="hero">

        <h1 th:text="${program.title}">
            Course Title
        </h1>

        <p th:text="${program.description}">
            Course description
        </p>

    </section>

    <section class="modules"
             th:if="${!#lists.isEmpty(modules)}">

        <article class="module"
                 th:each="module : ${modules}">

            <div class="module-number"
                 th:text="${module.moduleOrder}">
                1
            </div>

            <div class="module-content">

                <h3 th:text="${module.title}">
                    Module Title
                </h3>

                <p th:text="${module.description}">
                    Module description
                </p>

            </div>

            <div class="module-status">
                Available
            </div>

        </article>

    </section>

    <section class="empty"
             th:if="${#lists.isEmpty(modules)}">

        <h3>No modules available yet</h3>

        <p>
            Course modules will be added soon.
        </p>

    </section>

</main>

</body>
</html>
